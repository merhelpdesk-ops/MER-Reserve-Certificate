    function copyToClipboard(text, btn) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const textSpan = btn.querySelector('span');
        const origText = textSpan.innerText;
        textSpan.innerText = i18n[currentLang].copied;
        btn.classList.add('bg-brand-500', 'text-slate-950', 'border-brand-400', 'font-bold');
        btn.classList.remove('bg-slate-800', 'text-slate-300');

        setTimeout(() => {
          textSpan.innerText = origText;
          btn.classList.remove('bg-brand-500', 'text-slate-950', 'border-brand-400', 'font-bold');
          btn.classList.add('bg-slate-800', 'text-slate-300');
        }, 1800);
      }).catch(err => {
        console.error(err);
      });
    }

                        'class="shrink-0 inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition-all text-[11px] font-medium active:scale-95 cursor-pointer">' +
                  '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>' +
                  '</svg>' +
                  '<span>' + t.copy + '</span>' +
                '</button>' +
              '</div>';
          }).join('');

          return '<div class="pt-2 border-t border-slate-800/60 space-y-2">' +
              '<div class="text-[10px] sm:text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">' +
                '<svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
                  '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>' +
                  '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>' +
                '</svg>' +
                sectionTitle +
              '</div>' +
              '<div class="grid grid-cols-1 ' + gridCols + ' gap-2">' +
                itemsHtml +
              '</div>' +
            '</div>';
        };

        const reserveAddressesHtml = renderAddressList(item.reserveAddresses, t.reserveAddresses);
        
        let contractAddressesHtml = '';
        if (item.contractAddresses && item.contractAddresses.length > 0) {
          const warningHtml = '<div class="flex items-start gap-2 bg-amber-500/10 border border-amber-500/20 text-amber-300 text-[11px] px-3 py-2 rounded-xl mt-2">' +
              '<svg class="w-4 h-4 shrink-0 mt-0.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>' +
              '<span>' + t.depositWarning + '</span>' +
            '</div>';
          contractAddressesHtml = renderAddressList(item.contractAddresses, t.contractAddresses) + warningHtml;
        }

        const subLabelHtml = item.isMer
          ? '<span class="inline-flex items-center px-2 py-0.5 rounded bg-brand-500/10 text-brand-400 border border-brand-500/20 text-[10px] sm:text-[11px] font-medium">' + t.nativeToken + '</span>'
          : '<span class="text-slate-400">' + t.backedAsset + '</span> <span class="text-slate-200 font-semibold">' + tokenMeta.nativeUnit + '</span>';

        const reserveText = item.isMer ? t.reserveLabel : t.nativeReserveLabel;

        return '<div class="group relative bg-dark-card border border-slate-800/80 hover:border-slate-700/80 hover:bg-dark-cardHover rounded-2xl p-4 sm:p-5 shadow-glow-card hover:shadow-glow-emerald transition-all duration-300 space-y-3.5 sm:space-y-4">' +
            '<div class="flex items-center justify-between gap-3 pb-3 border-b border-slate-800/80">' +
              '<div class="flex items-center gap-3 sm:gap-3.5 min-w-0">' +
                '<div class="relative shrink-0">' +
                  '<img src="' + item.iconImg + '" alt="' + tokenMeta.title + '" ' +
                       'onerror="this.src=\'https://via.placeholder.com/40/111827/ffffff?text=' + tokenMeta.nativeUnit + '\'" ' +
                       'class="w-10 h-10 sm:w-11 sm:h-11 rounded-full object-cover border-2 border-slate-700/60 shadow-md group-hover:scale-105 transition duration-300">' +
                  '<span class="absolute -bottom-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-brand-500 text-[9px] text-black font-extrabold shadow">✓</span>' +
                '</div>' +
                '<div class="min-w-0">' +
                  '<h3 class="text-base sm:text-lg font-bold text-white tracking-tight leading-tight truncate">' +
                    tokenMeta.title +
                  '</h3>' +
                  '<div class="text-[11px] sm:text-xs text-slate-400 font-mono mt-1 truncate">' +
                    subLabelHtml +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div class="text-right shrink-0 ml-1">' +
                '<div class="text-xl sm:text-2xl font-black text-brand-400 font-mono tracking-tight drop-shadow-[0_0_8px_rgba(34,197,94,0.3)]">' +
                  item.ratio +
                '</div>' +
                '<div class="text-[9px] sm:text-[10px] text-slate-400 uppercase tracking-widest font-semibold">' + t.ratioLabel + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden p-0.5 border border-slate-800">' +
              '<div class="bg-gradient-to-r from-brand-600 to-brand-400 h-full rounded-full transition-all duration-500 w-full shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>' +
            '</div>' +
            '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-3">' +
              '<div class="bg-slate-950/60 border border-slate-800/60 group-hover:border-slate-700/50 rounded-xl p-3 sm:p-3.5 flex flex-col justify-between transition-colors">' +
                '<span class="text-[10px] sm:text-[11px] font-medium text-slate-400 mb-1 flex items-center gap-1.5">' +
                  '<span class="w-1.5 h-1.5 rounded-full bg-slate-500 shrink-0"></span>' +
                  t.totalSupplyLabel +
                '</span>' +
                '<span class="text-sm sm:text-base font-bold text-slate-100 font-mono tracking-tight">' + item.totalSupply + ' <span class="text-xs text-slate-400 font-sans font-normal">' + tokenMeta.issuedUnit + '</span></span>' +
              '</div>' +
              '<div class="bg-slate-950/60 border border-slate-800/60 group-hover:border-slate-700/50 rounded-xl p-3 sm:p-3.5 flex flex-col justify-between transition-colors">' +
                '<span class="text-[10px] sm:text-[11px] font-medium text-slate-400 mb-1 flex items-center gap-1.5">' +
                  '<span class="w-1.5 h-1.5 rounded-full bg-blue-400 shrink-0"></span>' +
                  t.circulatingSupplyLabel +
                '</span>' +
                '<span class="text-sm sm:text-base font-bold text-slate-100 font-mono tracking-tight">' + item.circulatingSupply + ' <span class="text-xs text-slate-400 font-sans font-normal">' + tokenMeta.issuedUnit + '</span></span>' +
              '</div>' +
              '<div class="bg-slate-950/60 border border-slate-800/60 group-hover:border-slate-700/50 rounded-xl p-3 sm:p-3.5 flex flex-col justify-between transition-colors">' +
                '<span class="text-[10px] sm:text-[11px] font-medium text-slate-400 mb-1 flex items-center gap-1.5">' +
                  '<span class="w-1.5 h-1.5 rounded-full bg-brand-400 shrink-0"></span>' +
                  reserveText +
                '</span>' +
                '<span class="text-sm sm:text-base font-bold text-brand-400 font-mono tracking-tight">' + item.nativeReserve + ' <span class="text-xs text-slate-400 font-sans font-normal">' + tokenMeta.nativeUnit + '</span></span>' +
              '</div>' +
            '</div>' +
            reserveAddressesHtml +
            contractAddressesHtml +
          '</div>';
      }).join('');
    }

    document.getElementById('langSelect').addEventListener('change', (e) => {
      currentLang = e.target.value;
      updatePageText();
    });

    updatePageText();
  </script>
</body>
</html>
