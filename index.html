    function copyToClipboard(text, btn) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const textSpan = btn.querySelector('span');
        const origText = textSpan.innerText;
        textSpan.innerText = i18n[currentLang].copied;
        btn.classList.add('bg-emerald-500', 'text-black', 'border-emerald-400', 'font-bold', 'shadow-[0_0_12px_#34d399]');
        btn.classList.remove('bg-slate-900', 'text-slate-300', 'border-white/[0.08]');

        setTimeout(() => {
          textSpan.innerText = origText;
          btn.classList.remove('bg-emerald-500', 'text-black', 'border-emerald-400', 'font-bold', 'shadow-[0_0_12px_#34d399]');
          btn.classList.add('bg-slate-900', 'text-slate-300', 'border-white/[0.08]');
        }, 1800);
      }).catch(err => {
        console.error(err);
      });
    }

        }).join('');

        const symbolLabel = item.isMer ? item.symbol : item.merSymbol;
        const subLabel = item.isMer ? t.nativeToken : (t.backedAsset + ' ' + item.symbol);
        const reserveText = item.isMer ? t.reserveLabel : t.nativeReserveLabel;
        const gridCols = item.addresses.length > 1 ? 'sm:grid-cols-2' : '';

        return '<div class="group relative rounded-2xl bg-gradient-to-b from-slate-900/80 via-[#070c16]/90 to-slate-950/95 border border-white/[0.08] hover:border-emerald-500/50 p-5 sm:p-6 shadow-hud-card hover:shadow-hud-glow transition-all duration-300 space-y-4 backdrop-blur-xl overflow-hidden">' +
            '<!-- 顶部微光扫描线 -->' +
            '<div class="absolute inset-x-0 top-0 h-[1px] bg-gradient-to-r from-transparent via-emerald-500/20 group-hover:via-emerald-400 to-transparent transition-all duration-500"></div>' +
            
            '<div class="flex justify-between items-center pb-4 border-b border-white/[0.06]">' +
              '<div class="flex items-center gap-3 sm:gap-4 min-w-0">' +
                '<div class="relative shrink-0">' +
                  '<div class="absolute -inset-0.5 rounded-full bg-gradient-to-tr from-emerald-500 to-cyan-500 opacity-30 group-hover:opacity-80 blur transition duration-300"></div>' +
                  '<img src="' + item.iconImg + '" alt="' + item.merSymbol + '" ' +
                       'onerror="this.src=\'https://via.placeholder.com/40/111827/ffffff?text=' + item.symbol + '\'" ' +
                       'class="relative w-11 h-11 sm:w-12 sm:h-12 rounded-full object-cover border border-white/20 shadow-md transition-transform duration-300 group-hover:scale-105">' +
                  '<span class="absolute -bottom-0.5 -right-0.5 flex h-4 w-4 items-center justify-center rounded-full bg-emerald-400 text-[9px] text-black font-black shadow ring-2 ring-cyber-bg">✓</span>' +
                '</div>' +
                '<div class="min-w-0">' +
                  '<div class="flex items-center gap-2">' +
                    '<h3 class="text-base sm:text-lg font-bold text-white tracking-wide truncate font-sans">' + item.name + '</h3>' +
                    '<span class="text-[9px] sm:text-[10px] uppercase font-mono font-bold px-2 py-0.5 rounded-md bg-white/[0.05] text-emerald-300 border border-emerald-500/20 shrink-0 shadow-inner">' +
                      symbolLabel +
                    '</span>' +
                  '</div>' +
                  '<span class="text-[11px] sm:text-xs text-slate-400 font-mono truncate block mt-0.5">' + subLabel + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="text-right shrink-0 ml-2">' +
                '<div class="text-2xl sm:text-3xl font-black text-emerald-400 font-mono tracking-tight drop-shadow-[0_0_12px_rgba(16,185,129,0.45)]">' +
                  item.ratio +
                '</div>' +
                '<div class="text-[9px] sm:text-[10px] text-slate-400 uppercase tracking-widest font-mono font-semibold mt-0.5">' + t.ratioLabel + '</div>' +
              '</div>' +
            '</div>' +

            '<!-- 全息能量刻度槽 -->' +
            '<div class="w-full bg-[#050810] h-1.5 rounded-full overflow-hidden p-[1px] border border-white/[0.07]">' +
              '<div class="bg-gradient-to-r from-emerald-600 via-emerald-400 to-cyan-400 h-full rounded-full transition-all duration-700 w-full shadow-[0_0_10px_rgba(16,185,129,0.7)]"></div>' +
            '</div>' +

            '<!-- 核心数据三联格 -->' +
            '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">' +
              '<div class="bg-[#060a12]/70 border border-white/[0.05] hover:border-white/[0.12] rounded-xl p-3.5 flex flex-col justify-between transition-colors">' +
                '<span class="text-[10px] sm:text-[11px] font-mono font-medium text-slate-400 mb-1.5 flex items-center gap-1.5">' +
                  '<span class="w-1.5 h-1.5 rounded-full bg-slate-500 shrink-0"></span>' +
                  t.totalSupplyLabel +
                '</span>' +
                '<span class="text-sm sm:text-base font-bold text-slate-100 font-mono tracking-tight">' + item.totalSupply + ' <span class="text-xs text-slate-500 font-sans font-normal">' + item.merSymbol + '</span></span>' +
              '</div>' +
              '<div class="bg-[#060a12]/70 border border-white/[0.05] hover:border-white/[0.12] rounded-xl p-3.5 flex flex-col justify-between transition-colors">' +
                '<span class="text-[10px] sm:text-[11px] font-mono font-medium text-slate-400 mb-1.5 flex items-center gap-1.5">' +
                  '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shrink-0 shadow-[0_0_6px_rgba(6,182,212,0.6)]"></span>' +
                  t.circulatingSupplyLabel +
                '</span>' +
                '<span class="text-sm sm:text-base font-bold text-slate-100 font-mono tracking-tight">' + item.circulatingSupply + ' <span class="text-xs text-slate-500 font-sans font-normal">' + item.merSymbol + '</span></span>' +
              '</div>' +
              '<!-- 原生储备核心凸显格 -->' +
              '<div class="bg-emerald-950/20 border border-emerald-500/30 hover:border-emerald-500/50 rounded-xl p-3.5 flex flex-col justify-between transition-all shadow-[inset_0_0_20px_rgba(16,185,129,0.06)]">' +
                '<span class="text-[10px] sm:text-[11px] font-mono font-semibold text-emerald-400 mb-1.5 flex items-center gap-1.5">' +
                  '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0 shadow-[0_0_8px_#34d399]"></span>' +
                  reserveText +
                '</span>' +
                '<span class="text-sm sm:text-base font-bold text-emerald-300 font-mono tracking-tight drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]">' + item.nativeReserve + ' <span class="text-xs text-emerald-500/70 font-sans font-normal">' + item.symbol + '</span></span>' +
              '</div>' +
            '</div>' +

            '<!-- 储备金智能合约地址区块 -->' +
            '<div class="pt-3 border-t border-white/[0.06] space-y-2.5">' +
              '<div class="text-[10px] sm:text-[11px] font-mono font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">' +
                '<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
                  '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>' +
                '</svg>' +
                t.reserveAddresses +
              '</div>' +
              '<div class="grid grid-cols-1 ' + gridCols + ' gap-2">' +
                addressesHtml +
              '</div>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    document.getElementById('langSelect').addEventListener('change', (e) => {
      currentLang = e.target.value;
      updatePageText();
    });

    updatePageText();
  </script>
</body>
</html>
