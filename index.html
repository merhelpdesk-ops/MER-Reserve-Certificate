<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MER Protocol - Proof of Reserves</title>
  
  <link rel="canonical" href="https://reserve.mer.finance/" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://reserve.mer.finance/">
  <meta property="og:title" content="MER Protocol Reserve Proof">
  <meta property="og:description" content="Transparent 1:1 Proof of Reserves for MER Assets and Native Vaults.">
  <meta property="og:image" content="merposter.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MER Protocol Reserve Proof">
  <meta name="twitter:description" content="Transparent 1:1 Proof of Reserves for MER Assets and Native Vaults.">
  <meta name="twitter:image" content="merposter.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              900: '#14532d',
            },
            dark: {
              bg: '#0b0f17',
              card: '#111827',
              border: '#1f2937',
              hover: '#1f2937'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">

  <header class="border-b border-dark-border bg-dark-card/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center gap-2">
      <div class="flex items-center gap-3">
        <img src="merlogo.webp" alt="MER Logo" class="h-9 w-auto object-contain">
        <div class="border-l border-dark-border pl-3">
          <h1 class="text-sm font-bold text-white tracking-wide" id="txtTitle">MER 储备金证明</h1>
          <p class="text-[10px] text-gray-400" id="txtSubtitle">100% 资产准备金保证</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-brand-500/10 text-brand-500 border border-brand-500/20">
          <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
          <span id="txtStatus">实时审计中</span>
        </span>
        <select id="langSelect" class="bg-dark-card border border-dark-border text-xs text-gray-200 px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-brand-500 cursor-pointer">
          <option value="zh">简体中文</option>
          <option value="zht">繁體中文</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-dark-card border border-dark-border p-5 rounded-2xl gap-3">
      <div>
        <div class="text-xs text-gray-400 mb-1" id="txtLastAuditLabel">上次验证时间 (UTC+8)</div>
        <div class="text-lg font-bold text-white font-mono" id="txtLastAuditValue">2026年9月14日 上午12:00</div>
      </div>
      <div class="text-xs text-gray-400 max-w-sm" id="txtNotice">
        所有 MER 协议代币均由原生区块链资产以 >100% 比例超额抵押托管。
      </div>
    </div>

    <div id="reservesList" class="space-y-4"></div>

  </main>

  <script>
    const i18n = {
      zh: {
        title: "MER 储备金证明",
        subtitle: "100% 资产准备金保证",
        status: "实时审计中",
        lastAuditLabel: "上次验证时间 (UTC+8)",
        lastAuditValue: "2026年9月14日 上午12:00",
        notice: "所有 MER 协议代币均由原生区块链资产以 >100% 比例超额抵押托管。",
        ratioLabel: "储备金率",
        merIssued: "MER 币余额",
        nativeReserves: "原生储备余额"
      },
      zht: {
        title: "MER 儲備金證明",
        subtitle: "100% 資產準備金保證",
        status: "實時審計中",
        lastAuditLabel: "上次驗證時間 (UTC+8)",
        lastAuditValue: "2026年9月14日 上午12:00",
        notice: "所有 MER 協議代幣均由原生區塊鏈資產以 >100% 比例超額抵押託管。",
        ratioLabel: "儲備金率",
        merIssued: "MER 幣餘額",
        nativeReserves: "原生儲備餘額"
      },
      en: {
        title: "MER Proof of Reserves",
        subtitle: "100% Backed Reserve Guarantee",
        status: "Real-Time Audited",
        lastAuditLabel: "Last Verification (UTC+8)",
        lastAuditValue: "Sep 14, 2026 12:00 AM",
        notice: "All MER protocol tokens are fully backed and over-collateralized by native blockchain assets.",
        ratioLabel: "Reserve Ratio",
        merIssued: "MER Token Balance",
        nativeReserves: "Native Reserve Balance"
      },
      ko: {
        title: "MER 준비금 증명",
        subtitle: "100% 자산 준비금 보증",
        status: "실시간 감사 중",
        lastAuditLabel: "마지막 검증 시간 (UTC+8)",
        lastAuditValue: "2026년 9월 14일 오전 12:00",
        notice: "모든 MER 프로토콜 토큰은 원본 블록체인 자산으로 100% 이상 초과 담보 보관됩니다.",
        ratioLabel: "준비율",
        merIssued: "MER 토큰 잔액",
        nativeReserves: "원본 준비금 잔액"
      }
    };

    const reservesData = [
      {
        name: "Bitcoin",
        symbol: "BTC",
        merSymbol: "MERBTC",
        ratio: "111%",
        iconImg: "MERBTC.jpg",
        merBalance: "134,399",
        nativeBalance: "148,552"
      },
      {
        name: "Ethereum",
        symbol: "ETH",
        merSymbol: "MERETH",
        ratio: "101%",
        iconImg: "MERETH.jpg",
        merBalance: "1,725,703",
        nativeBalance: "1,749,426"
      },
      {
        name: "Solana",
        symbol: "SOL",
        merSymbol: "MERSOL",
        ratio: "108%",
        iconImg: "MERSOL.jpg",
        merBalance: "450,000",
        nativeBalance: "486,000"
      },
      {
        name: "USD Coin",
        symbol: "USDC",
        merSymbol: "MERUSD",
        ratio: "102%",
        iconImg: "MERUSD.jpg",
        merBalance: "1,661,975,912",
        nativeBalance: "1,671,317,865"
      }
    ];

    let currentLang = 'zh';

    function updatePageText() {
      const t = i18n[currentLang];
      document.getElementById('txtTitle').innerText = t.title;
      document.getElementById('txtSubtitle').innerText = t.subtitle;
      document.getElementById('txtStatus').innerText = t.status;
      document.getElementById('txtLastAuditLabel').innerText = t.lastAuditLabel;
      document.getElementById('txtLastAuditValue').innerText = t.lastAuditValue;
      document.getElementById('txtNotice').innerText = t.notice;

      renderReserves();
    }

    function renderReserves() {
      const t = i18n[currentLang];
      const container = document.getElementById('reservesList');
      container.innerHTML = reservesData.map(item => `
        <div class="bg-dark-card border border-dark-border rounded-2xl p-5 shadow-lg hover:border-dark-hover transition-all space-y-4">
          <div class="flex justify-between items-center pb-3 border-b border-dark-border">
            <div class="flex items-center gap-3">
              <img src="${item.iconImg}" alt="${item.merSymbol}" class="w-10 h-10 rounded-full object-cover border border-dark-border">
              <div>
                <h3 class="text-base font-bold text-white">${item.name}</h3>
                <span class="text-xs text-gray-400 font-mono">${item.merSymbol} / ${item.symbol}</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-xl font-extrabold text-brand-500 font-mono">${item.ratio}</div>
              <div class="text-[10px] text-gray-400 uppercase tracking-wider">${t.ratioLabel}</div>
            </div>
          </div>

          <div class="space-y-3">
            <!-- MER 资产余额 (在上) -->
            <div class="bg-dark-bg/60 border border-dark-border/60 rounded-xl p-3.5 flex justify-between items-center">
              <div>
                <span class="text-xs text-gray-400 block">${t.merIssued}</span>
                <span class="text-sm font-semibold text-gray-200">${item.merSymbol}</span>
              </div>
              <span class="text-base font-bold text-white font-mono">${item.merBalance}</span>
            </div>

            <!-- 原生储备余额 (在下) -->
            <div class="bg-dark-bg/60 border border-dark-border/60 rounded-xl p-3.5 flex justify-between items-center">
              <div>
                <span class="text-xs text-gray-400 block">${t.nativeReserves}</span>
                <span class="text-sm font-semibold text-gray-200">${item.symbol}</span>
              </div>
              <span class="text-base font-bold text-white font-mono">${item.nativeBalance}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('langSelect').addEventListener('change', (e) => {
      currentLang = e.target.value;
      updatePageText();
    });

    updatePageText();
  </script>
</body>
</html>
